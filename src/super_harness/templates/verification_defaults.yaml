layers:
  baseline: { enabled: true }
  framework_adapter: { enabled: true }
  user_checks: { enabled: true }
defaults:
  timeout_seconds: 300
  must_pass: true
  capture: both
  workdir: .
  env: { CI: "1" }
execution:
  mode: parallel
  max_parallelism: 4
  fail_fast: false
# Commands are direct argv lists. A command string is valid only with
# `shell: sh`, which uses /bin/sh on POSIX and Git for Windows' native
# usr/bin/sh.exe on Windows.
checks: []
adapter_provided: []
