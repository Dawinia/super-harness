# User-owned activation record for the new external-evidence contract.
# The recognition record below is bound by process.policy_digest. It records the
# owner decision without claiming a cryptographic identity for the reviewer.
version: review-recognition/v1
enabled: true
process:
  id: codex-subagent-review
  version: codex-subagent-review/v1
  kinds:
    - plan
    - code
  issuers:
    - codex-subagent
  evidence_forms:
    - json
  requirements:
    execution:
      boundary: outside-super-harness-core
      invoker: implementation-agent
      reviewer: independent-codex-subagent
    subject: exact-frozen-plan-or-code-subject
    retention:
      object_identifier: required
      original_evidence: required
      provenance: required
      explicit_decision:
        - approve
        - reject
    non_approval:
      execution_failure: true
      empty_result: true
      skip: true
    retry:
      blocking_finding: fix-and-re-review
      per_review_confirmation: not_required
    owner_recognition:
      id: owner-recognition-2026-09-14-plan-authority
      source: owner-authorization-in-current-delivery-task
      recorded_on: "2026-09-14"
      decision: recognize
      scope:
        - plan-review
        - code-review
      historical_effect: no-retroactive-change-to-prior-skips
      scope_boundary: no-expansion-beyond-this-process
  policy_digest: 41e290b360e52e83f5fd6e4538c4c465cbb758871e47c05972b28c8e251d41b4
