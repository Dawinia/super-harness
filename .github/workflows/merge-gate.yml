name: merge-gate
# Layer-2 CI merge gate (HG-DF C) — self-host. Re-derives, from the PR diff +
# committed .harness/attestations/<slug>.jsonl, whether every changed file went
# through a complete, ordered, scope-covering lifecycle. Fail-closed: a git /
# merge-base failure exits non-zero (never a vacuous pass). fetch-depth: 0 makes
# the base...head merge-base reachable.
on:
  pull_request: {}

jobs:
  attest-verify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Checkout trusted baseline verifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .harness-trusted-base
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build isolated verifier from trusted BASE_SHA
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/super-harness-verifier"
          verifier="$RUNNER_TEMP/super-harness-verifier/bin"
          trusted_sha="$(git -C .harness-trusted-base rev-parse HEAD)"
          test "$trusted_sha" = "$BASE_SHA"
          "$verifier/python" -m pip install --disable-pip-version-check \
            "$GITHUB_WORKSPACE/.harness-trusted-base[dev]"
          env -u PYTHONPATH TRUSTED_ROOT="$GITHUB_WORKSPACE/.harness-trusted-base" \
            BASE_SHA="$BASE_SHA" "$verifier/python" -c \
            'import hashlib, os, pathlib, subprocess; from super_harness.cli import attest; from super_harness.core import events; trusted = pathlib.Path(os.environ["TRUSTED_ROOT"]); verifier = pathlib.Path(attest.__file__).resolve(); installed = pathlib.Path(events.__file__).resolve(); expected = trusted / "src" / "super_harness" / "core" / "events.py"; assert subprocess.check_output(["git", "-C", str(trusted), "rev-parse", "HEAD"], text=True).strip() == os.environ["BASE_SHA"]; assert "site-packages" in str(verifier); assert "site-packages" in str(installed); assert ".harness-trusted-base" not in str(verifier); assert ".harness-trusted-base" not in str(installed); assert hashlib.sha256(installed.read_bytes()).hexdigest() == hashlib.sha256(expected.read_bytes()).hexdigest(); print("A17 verifier loaded from {} and matches trusted BASE_SHA={}".format(verifier, os.environ["BASE_SHA"]))'
      - name: Verify lifecycle attestations cover the diff
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          env -u PYTHONPATH "$RUNNER_TEMP/super-harness-verifier/bin/super-harness" \
            attest verify --base "$BASE_SHA" --head "$HEAD_SHA"

  candidate-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install candidate package for candidate tests only
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run new-contract acceptance tests
        run: python -m pytest -q tests/unit/core/test_approval.py tests/integration/lifecycle/test_plan_authority.py
